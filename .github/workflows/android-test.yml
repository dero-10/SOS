# Salin ke ROOT repository proyek Anda: .github/workflows/android-test.yml
# Menjalankan unit test (folder test/) setiap push ke main dan setiap pull request.
#
# Instrumented test (androidTest/) TIDAK dijalankan di sini karena butuh emulator
# (lambat di CI gratis). Lihat job "ui-test" di bawah (bonus, dikomentari).

name: Android Tests

on:
  push:
    branches: [ main, pertemuan-13 ]
  pull_request:
    branches: [ main ]

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4      # cache Gradle otomatis

      # gradlew yang di-commit dari Windows sering tidak punya izin eksekusi
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Supabase URL/key are optional (read from local.properties); without them the build uses empty
      # BuildConfig values, which is fine for unit tests.

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # Laporan HTML diunggah juga saat GAGAL, agar penyebabnya bisa dibaca
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  # ── BONUS: instrumented test (Room DAO + Compose UI) di emulator ────────────
  # Hapus tanda komentar jika ingin mencoba. Butuh ±10–15 menit per run.
